
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111d">
<title>AI HAYATO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111d;color:#eaf4ff;font-family:Arial,sans-serif}
header{height:70px;padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #244057;background:#0b1928}
.logo{width:42px;height:42px;border:1px solid #4b91c5;border-radius:12px;display:grid;place-items:center;color:#79caff;font-size:22px}
h1{font-size:19px;margin:0;letter-spacing:2px}
.status{font-size:11px;color:#70d9a5;margin-top:5px}
main{max-width:850px;margin:auto;padding:18px;height:calc(100dvh - 150px);display:flex;flex-direction:column}
.welcome{text-align:center;margin:auto;color:#a9c9e2}
.welcome h2{font-size:27px;letter-spacing:4px;color:#83caff}
#chat{display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding:8px 0}
.msg{padding:13px 15px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.65}
.ai{align-self:flex-start;background:#142c41;border:1px solid #244c6a}
.user{align-self:flex-end;background:#14517a}
.name{font-size:10px;color:#86caff;margin-bottom:5px}
#inputArea{max-width:850px;margin:auto;padding:12px 15px 18px;background:#0b1928;border-top:1px solid #244057}
.controls{display:flex;gap:8px}
textarea{flex:1;resize:none;min-width:0;height:48px;background:#13283a;border:1px solid #36536b;border-radius:12px;color:white;padding:13px;font-size:15px;outline:none}
button{border:1px solid #427da5;background:#143a57;color:#fff;border-radius:12px;padding:0 15px;font-size:17px}
button:active{background:#23618b}
button:disabled{opacity:.5}
.note{text-align:center;color:#718da5;font-size:10px;margin-top:9px}
</style>
</head>
<body>
<header>
<div class="logo">H</div>
<div>
<h1>AI HAYATO</h1>
<div class="status">● SYSTEM READY</div>
</div>
</header>

<main>
<div id="chat"></div>
<div class="welcome" id="welcome">
<h2>AI HAYATO</h2>
<p>システムを起動しました。</p>
<p>ご用件をお聞かせください。</p>
</div>
</main>

<div id="inputArea">
<div class="controls">
<button id="mic" title="音声入力">🎙</button>
<textarea id="input" placeholder="メッセージを入力..." rows="1"></textarea>
<button id="send">送信</button>
<button id="voice" title="音声読み上げ">🔊</button>
</div>
<div class="note">AI HAYATO SYSTEM ・ GEMINI AI</div>
</div>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const welcome=document.getElementById('welcome');
let history=[];

function addMessage(text,type){
 welcome.style.display='none';
 const div=document.createElement('div');
 div.className='msg '+type;
 if(type==='ai'){
  const name=document.createElement('div');
  name.className='name';
  name.textContent='AI HAYATO';
  div.appendChild(name);
 }
 const content=document.createElement('div');
 content.textContent=text;
 div.appendChild(content);
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message)return;
 input.value='';
 addMessage(message,'user');
 history.push({role:'user',parts:[{text:message}]});
 const button=document.getElementById('send');
 button.disabled=true;
 addMessage('情報を処理しています...','ai');
 const loading=chat.lastChild;

 try{
  const response=await fetch('/api/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({history})
  });
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  const answer=data.text||'回答を取得できませんでした。';
  loading.lastChild.textContent=answer;
  history.push({role:'model',parts:[{text:answer}]});
 }catch(error){
  loading.lastChild.textContent='AIサーバーに接続できません。サーバー設定を確認してください。';
  history.pop();
 }
 button.disabled=false;
 chat.scrollTop=chat.scrollHeight;
}

document.getElementById('send').addEventListener('click',sendMessage);
input.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

document.getElementById('voice').addEventListener('click',()=>{
 const messages=chat.querySelectorAll('.msg.ai');
 if(!messages.length)return;
 const text=messages[messages.length-1].lastChild.textContent;
 speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(text);
 speech.lang='ja-JP';
 speech.rate=1;
 speechSynthesis.speak(speech);
});

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
document.getElementById('mic').addEventListener('click',()=>{
 if(!SpeechRecognition){
  alert('このブラウザは音声入力に対応していません。');
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang='ja-JP';
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
 };
 recognition.start();
});
</script>
</body>
</html>
